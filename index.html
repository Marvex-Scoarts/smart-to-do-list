<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="todo-container">
    <!-- App Header -->
    <header>
      <h1>Smart To-Do List</h1>
      <p>Stay organized and get things done</p>
    </header>

    <!-- Input Section to Add Tasks -->
    <form id="todo-form">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="What do you need to do?" 
        required
      >
      <button type="submit">Add Task</button>
    </form>

    <!-- Filter Buttons -->
    <div class="filters">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <!-- Task List (Placeholder items for now) -->
    <ul id="todo-list">
      <li>
        <input type="checkbox">
        <span>Build the HTML structure</span>
        <button type="button">Delete</button>
      </li>
      <li>
        <input type="checkbox" checked>
        <span>Pick a fun coding project with my friend</span>
        <button type="button">Delete</button>
      </li>
      <li>
        <input type="checkbox">
        <span>Style the app with CSS</span>
        <button type="button">Delete</button>
      </li>
    </ul>
  </main>

 <script src="script.js"></script> 
</body>
</html>
